services:
  redis:
    image: redis:7-alpine
    container_name: omi-self-hosted-redis
    ports:
      - "6379:6379"
    volumes:
      - omi-self-hosted-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omi-self-hosted-redis-data:
